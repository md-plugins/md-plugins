name: Verify Packages And SSG Docs

on:
  push: # Trigger on push to any branch
  pull_request: # Trigger on pull request to any branch

jobs:
  vitest:
    name: Verify Packages And SSG Docs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24] # Test against multiple Node.js versions

    steps:
      # Checkout the repository code
      - uses: actions/checkout@v6

      # Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # Use Node.js
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # Install dependencies for all packages
      - name: Install dependencies
        run: pnpm install

      # Run checks and build the docs using the production SSG path.
      - name: Verify packages and SSG docs
        run: pnpm verify
